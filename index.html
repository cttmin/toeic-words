<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TOEIC Words">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>TOEIC Words</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* iOS 시스템 색 */
  :root {
    --bg: #F2F2F7; --card: #FFFFFF; --label: #000000;
    --secondary: rgba(60,60,67,.6); --tertiary: rgba(60,60,67,.3);
    --sep: rgba(60,60,67,.29); --fill: rgba(118,118,128,.12); --press: #D1D1D6;
    --tint: #007AFF; --green: #34C759; --red: #FF3B30; --orange: #FF9500; --yellow: #FFCC00; --indigo: #5856D6;
    --navbg: rgba(242,242,247,.8); --alertbg: rgba(242,242,242,.82);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: #1C1C1E; --label: #FFFFFF;
      --secondary: rgba(235,235,245,.6); --tertiary: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.65); --fill: rgba(118,118,128,.24); --press: #3A3A3C;
      --tint: #0A84FF; --green: #30D158; --red: #FF453A; --orange: #FF9F0A; --yellow: #FFD60A; --indigo: #5E5CE6;
      --navbg: rgba(22,22,24,.8); --alertbg: rgba(44,44,46,.85);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--label); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", Pretendard, "Segoe UI", "Malgun Gothic", sans-serif;
    font-size: 17px; line-height: 1.29; letter-spacing: -0.41px; -webkit-font-smoothing: antialiased;
  }
  button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 600px; margin: 0 auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }
  .hide { display: none !important; }
  .grow { flex: 1; min-width: 0; }
  svg { display: block; }

  /* 내비게이션 바 */
  .nav { position: sticky; top: 0; z-index: 10; margin: 0 -16px; padding: env(safe-area-inset-top) 8px 0;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px;
    background: var(--navbg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
  .nav.line { box-shadow: 0 .5px 0 var(--sep); }
  .nav .nl { justify-self: start; } .nav .nr { justify-self: end; }
  .nav .nt { font-weight: 600; text-align: center; white-space: nowrap; }
  .bar-btn { display: flex; align-items: center; gap: 3px; height: 44px; padding: 0 8px; border: 0; background: none; color: var(--tint); font-size: 17px; }
  .bar-btn:active { opacity: .3; }
  .bar-btn svg { width: 12px; height: 21px; }
  .bar-txt { padding: 0 8px; color: var(--secondary); font-variant-numeric: tabular-nums; }
  .large { font-size: 34px; font-weight: 700; letter-spacing: .37px; line-height: 1.2; margin: 2px 0 0; }
  .progress { height: 3px; background: var(--fill); margin: 0 -16px; }
  .progress > div { height: 100%; background: var(--tint); transition: width .25s ease-out; }

  /* 묶음 목록 (inset grouped) */
  .sh { font-size: 13px; line-height: 18px; letter-spacing: -0.08px; color: var(--secondary); text-transform: uppercase; padding: 0 16px 7px; margin-top: 30px; }
  .sf { font-size: 13px; line-height: 18px; letter-spacing: -0.08px; color: var(--secondary); padding: 7px 16px 0; }
  .group { background: var(--card); border-radius: 10px; overflow: hidden; }
  .group + .group { margin-top: 30px; }
  .cell { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 16px;
    background: var(--card); border: 0; text-align: left; color: var(--label); font-size: 17px; }
  .cell + .cell::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 16px); height: .5px; background: var(--sep); }
  .cell.ico + .cell.ico { --inset: 57px; }
  button.cell:active { background: var(--press); }
  button.cell:disabled { opacity: .4; }
  .cell .detail { color: var(--secondary); font-variant-numeric: tabular-nums; }
  .cell .two { padding: 11px 0; }
  .cell .sub { font-size: 13px; color: var(--secondary); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -0.08px; }
  .cell.tint { color: var(--tint); } .cell.danger { color: var(--red); } .cell.center { justify-content: center; }
  .chev { width: 8px; height: 13px; color: var(--tertiary); flex: none; }
  .check { width: 16px; height: 14px; color: var(--tint); flex: none; }
  .check.off { visibility: hidden; }
  .ic { width: 29px; height: 29px; border-radius: 7px; display: grid; place-items: center; color: #fff; font-size: 15px; font-weight: 600; flex: none; }
  .ic svg { width: 18px; height: 18px; }

  .stepper { display: flex; align-items: center; height: 32px; background: var(--fill); border-radius: 8px; flex: none; }
  .stepper button { width: 46px; height: 32px; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--label); }
  .stepper button:active { opacity: .3; }
  .stepper i { width: 1px; height: 18px; background: var(--sep); }

  /* 버튼 */
  .btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 50px; border: 0; border-radius: 12px;
    background: var(--tint); color: #fff; font-size: 17px; font-weight: 600; }
  .btn.gray { background: var(--fill); color: var(--tint); }
  .btn:active { opacity: .7; }
  .btn:disabled { opacity: .35; }
  .btns { display: flex; gap: 10px; margin-top: 20px; }
  .stack { margin-top: 24px; } .stack .btn + .btn { margin-top: 10px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 12px; border: 0; border-radius: 16px;
    background: var(--fill); color: var(--tint); font-size: 15px; font-weight: 600; }
  .pill:active { opacity: .5; }
  .pill svg { width: 17px; height: 17px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

  /* 공부 카드 */
  .card { background: var(--card); border-radius: 12px; padding: 20px 16px; margin-top: 16px; animation: in .25s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .card-head { display: flex; align-items: flex-start; gap: 12px; }
  .word { font-size: 28px; font-weight: 700; letter-spacing: .36px; line-height: 1.2; margin: 0; }
  .meaning { color: var(--secondary); margin: 4px 0 0; }
  .hr { height: .5px; background: var(--sep); margin: 16px 0; }
  .sent { font-size: 19px; line-height: 1.42; letter-spacing: -0.45px; margin: 0; }
  .trans { font-size: 16px; line-height: 1.45; color: var(--secondary); margin: 10px 0 0; letter-spacing: -0.3px; }
  mark { background: none; color: var(--tint); font-weight: 600; }
  .blank { display: inline-block; min-width: 56px; border-bottom: 2px solid var(--tint); }
  .star { border: 0; background: none; padding: 4px; margin: -4px -4px 0 auto; color: var(--tertiary); flex: none; }
  .star svg { width: 24px; height: 24px; transition: transform .2s ease-out; }
  .star path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
  .star.on { color: var(--yellow); }
  .star.on path { fill: currentColor; }
  .star.on svg { transform: scale(1.06); }

  .choice { padding: 11px 16px; line-height: 1.35; letter-spacing: -0.3px; font-size: 16px; }
  .choice .mark { width: 18px; height: 18px; flex: none; }
  .choice.right { color: var(--green); font-weight: 600; }
  .choice.wrong { color: var(--red); }
  .cell input, .cell select { flex: 1; min-width: 0; height: 44px; border: 0; background: none; outline: none; font-size: 17px; color: var(--label); }
  .cell input::placeholder, textarea::placeholder { color: var(--tertiary); }
  .cell .lab { width: 92px; flex: none; }
  .cell select { -webkit-appearance: none; appearance: none; text-align: right; text-align-last: right; color: var(--secondary); padding: 0; }
  .cell textarea { width: 100%; min-height: 132px; border: 0; outline: none; resize: vertical; background: none; padding: 11px 0; font-size: 15px; line-height: 1.4; }
  .fb { font-size: 15px; padding: 10px 16px 0; color: var(--secondary); min-height: 28px; }
  .fb b { color: var(--label); font-weight: 600; }
  .fb.ok { color: var(--green); font-weight: 600; }

  /* 알림창 (UIAlertController) */
  .alert-bg { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(0,0,0,.2); animation: fade .2s ease-out; }
  .alert { width: 270px; border-radius: 14px; overflow: hidden; text-align: center; background: var(--alertbg);
    -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); animation: pop .2s ease-out; }
  .alert .at { font-size: 17px; font-weight: 600; padding: 19px 16px 2px; }
  .alert .am { font-size: 13px; line-height: 18px; padding: 0 16px 19px; letter-spacing: -0.08px; }
  .alert .ab { display: flex; box-shadow: 0 -.5px 0 var(--sep); }
  .alert .ab button { flex: 1; height: 44px; border: 0; background: none; color: var(--tint); font-size: 17px; }
  .alert .ab button + button { box-shadow: -.5px 0 0 var(--sep); }
  .alert .ab button:active { background: rgba(127,127,127,.15); }
  .alert .ab .b { font-weight: 600; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(1.12); } }

  .done { text-align: center; padding: 40px 0 8px; }
  .done .circle { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 16px; display: grid; place-items: center; color: #fff; }
  .done .circle svg { width: 34px; height: 34px; }
  .done .big { font-size: 34px; font-weight: 700; letter-spacing: .37px; font-variant-numeric: tabular-nums; }
  .done .small { color: var(--secondary); margin-top: 4px; font-size: 15px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="words.js"></script>
<script>
/* ---------- 아이콘 (SF Symbols 느낌) ---------- */
const ICON = {
  back: `<svg viewBox="0 0 12 21"><path d="M10 2L2 10.5 10 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  chev: `<svg class="chev" viewBox="0 0 8 13"><path d="M1.5 1.5L6.5 6.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  check: `<svg viewBox="0 0 16 14"><path d="M1.6 7.6l4.4 4.4L14.4 1.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  checkC: `<svg class="mark" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="currentColor"/><path d="M5.5 10.3l3 3 6-6.3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  xC: `<svg class="mark" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="currentColor"/><path d="M6.5 6.5l7 7M13.5 6.5l-7 7" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`,
  star: `<svg viewBox="0 0 24 24"><path d="M12 3.4l2.62 5.32 5.88.86-4.25 4.14 1 5.85L12 16.8l-5.25 2.77 1-5.85L3.5 9.58l5.88-.86z"/></svg>`,
  starF: `<svg viewBox="0 0 24 24"><path d="M12 3.4l2.62 5.32 5.88.86-4.25 4.14 1 5.85L12 16.8l-5.25 2.77 1-5.85L3.5 9.58l5.88-.86z" fill="currentColor"/></svg>`,
  speaker: `<svg viewBox="0 0 24 24"><path d="M3.5 9.2h3.3L11.5 5v14l-4.7-4.2H3.5z" fill="currentColor"/><path d="M15 8.6a4.8 4.8 0 010 6.8M17.6 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  tortoise: `<svg viewBox="0 0 24 24"><path d="M3.5 9.2h3.3L11.5 5v14l-4.7-4.2H3.5z" fill="currentColor"/><path d="M15 9.5a3.5 3.5 0 010 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  book: `<svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4.5 9.5 4.6 12 6.2c2.5-1.6 5.5-1.7 8-.7v13c-2.5-1-5.5-.9-8 .7-2.5-1.6-5.5-1.7-8-.7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 6.2v13" stroke="currentColor" stroke-width="1.8"/></svg>`,
  list: `<svg viewBox="0 0 24 24"><circle cx="5" cy="6.5" r="1.5" fill="currentColor"/><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="5" cy="17.5" r="1.5" fill="currentColor"/><path d="M9.5 6.5H20M9.5 12H20M9.5 17.5H20" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>`,
  pencil: `<svg viewBox="0 0 24 24"><path d="M5 19l1-4L16 5l3 3L9 18z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`,
  sync: `<svg viewBox="0 0 24 24"><path d="M19 8.5A7.5 7.5 0 005.6 6.6M5 15.5a7.5 7.5 0 0013.4 1.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19.2 3.8v4.7h-4.7M4.8 20.2v-4.7h4.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

/* ---------- 저장 ---------- */
const KEY = "toeic-words-v1";
let db;
const keyOf = it => it.word.toLowerCase() + "||" + it.sentence;

function load() {
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) { db = null; }
  normalize();
  mergeWords();
  saveLocal();
}
function normalize() {
  if (!db || !Array.isArray(db.days)) db = { days: [], count: 10, picked: ["Day 1"], seen: [] };
  if (!db.marked) db.marked = [];
  if (!db.picked) db.picked = [];
  if (!db.count) db.count = 10;
  if (!db.seen) db.seen = db.days.flatMap(d => d.items.map(it => d.name + "||" + it.word.toLowerCase()));
}
// words.js 에 새로 생긴 단어만 앱에 넣기 (앱에서 지운 건 다시 안 넣음)
function mergeWords() {
  if (typeof WORDS === "undefined") return;
  for (const d of WORDS) {
    let day = db.days.find(x => x.name === d.day);
    for (const a of d.items) {
      const k = d.day + "||" + a[0].trim().toLowerCase();
      if (db.seen.includes(k)) continue;
      if (!day) { day = { name: d.day, items: [] }; db.days.push(day); }
      day.items.push(toItem(a)); db.seen.push(k);
    }
  }
}
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
// 사용자가 뭔가 바꿨을 때: 이 기기에 저장 + 다른 기기로 보내기
function save() { db.updatedAt = Date.now(); saveLocal(); schedulePush(); }
function toItem(a) {
  return { word: a[0].trim(), meaning: (a[1] || "").trim(), sentence: (a[2] || "").trim(),
           translation: (a[3] || "").trim(), chunk: (a[4] || "").trim() || guessChunk(a[1], a[3]) };
}
function guessChunk(meaning, translation) {
  meaning = (meaning || "").split(/[,;/]/)[0].trim();
  const stem = meaning.replace(/(하다|되다|시키다|이다|한|하게|적인|적으로)$/, "");
  return translation && stem && translation.includes(stem) ? stem : "";
}

/* ---------- 도우미 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLowerCase().replace(/[\s.,'’"!?~·-]/g, "");
const allItems = () => db.days.flatMap(d => d.items);
function render(html) { $("#app").innerHTML = html; window.scrollTo(0, 0); }

function formInSentence(it) {
  const w = it.word.toLowerCase();
  const tries = [w, w.replace(/e$/, ""), w.replace(/y$/, "i"), w.slice(0, Math.max(3, w.length - 2))];
  for (const t of tries) {
    const m = it.sentence.match(new RegExp("\\b(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[a-z]*)", "i"));
    if (m) return m[1];
  }
  return null;
}
function markSentence(it) {
  const f = formInSentence(it); const s = esc(it.sentence);
  return f ? s.replace(esc(f), "<mark>" + esc(f) + "</mark>") : s;
}
const hasChunk = it => it.chunk && it.translation.includes(it.chunk);
function markTranslation(it, blank) {
  const t = esc(it.translation);
  if (!hasChunk(it)) return t;
  return t.replace(esc(it.chunk), blank ? '<span class="blank">&nbsp;</span>' : "<mark>" + esc(it.chunk) + "</mark>");
}

/* ---------- 화면 틀 ---------- */
let screen = null; // 지금 보고 있는 목록 화면 (다른 기기 기록이 오면 다시 그림)
function navbar(left, title, right, line = true) {
  return `<nav class="nav ${line ? "line" : ""}"><div class="nl">${left || ""}</div><div class="nt">${title || ""}</div><div class="nr">${right || ""}</div></nav>`;
}
const backBtn = (label, fn) => `<button class="bar-btn" onclick="${fn}">${ICON.back}${esc(label)}</button>`;
const textBtn = (label, fn, bold) => `<button class="bar-btn" style="${bold ? "font-weight:600" : ""}" onclick="${fn}">${esc(label)}</button>`;

/* ---------- 별표 ---------- */
const isMarked = it => db.marked.includes(keyOf(it));
function setMark(it, on) {
  const k = keyOf(it);
  db.marked = db.marked.filter(x => x !== k);
  if (on) db.marked.push(k);
  save();
}
function markedItems() {
  const map = new Map(allItems().map(it => [keyOf(it), it]));
  return db.marked.map(k => map.get(k)).filter(Boolean);
}
function starHTML(it, onclick = "toggleStar(this)") {
  return `<button class="star ${isMarked(it) ? "on" : ""}" aria-label="별표" onclick="${onclick}">${ICON.star}</button>`;
}
function toggleStar(el) {
  const it = S.list[S.i]; const on = !isMarked(it); setMark(it, on);
  el.classList.toggle("on", on);
}
function refreshStar(it) { const f = $(".card .star"); if (f) f.classList.toggle("on", isMarked(it)); }

/* ---------- 발음 ---------- */
let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => /^en(-|_)/i.test(v.lang));
  const pref = [/natural/i, /samantha/i, /google us english/i, /aria|jenny|guy/i, /en-us/i];
  for (const p of pref) { const v = vs.find(v => p.test(v.name) || p.test(v.lang)); if (v) return (voice = v); }
  voice = vs[0] || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, rate = 0.95) {
  if (!("speechSynthesis" in window)) return alert("이 브라우저는 읽어 주기를 지원하지 않아요.");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice; u.lang = voice ? voice.lang : "en-US"; u.rate = rate;
  speechSynthesis.speak(u);
}

/* ---------- 홈 ---------- */
const STEPS = [
  null,
  { en: "Read & Listen", ko: "예문 보고 듣기", color: "var(--tint)" },
  { en: "Choose", ko: "해석 4개 중 고르기", color: "var(--orange)" },
  { en: "Fill in", ko: "빈칸 해석 쓰기", color: "var(--green)" },
];
function stepRows(fn, total) {
  return `<div class="group">` + [1, 2, 3].map(n => `
    <button class="cell ico" ${total ? "" : "disabled"} onclick="${fn}(${n})">
      <span class="ic" style="background:${STEPS[n].color}">${n}</span>
      <span class="grow two"><div>${STEPS[n].en}</div><div class="sub">STEP ${n} · ${STEPS[n].ko}</div></span>
      ${ICON.chev}
    </button>`).join("") + `</div>`;
}
function home() {
  S = null; screen = home;
  const total = pickedItems().length;
  const m = markedItems().length;
  render(navbar("", "", textBtn("단어 추가", "manage()"), false) + `
    <h1 class="large">TOEIC Words</h1>

    <div class="sh">Day</div>
    <div class="group">${db.days.map((d, i) => `
      <button class="cell" onclick="toggleDay(${i})">
        <span class="grow">${esc(d.name)}</span><span class="detail">${d.items.length}</span>
        <span class="check ${db.picked.includes(d.name) ? "" : "off"}">${ICON.check}</span>
      </button>`).join("")}
    </div>

}

/* 채점: 맞음 · 비슷함(한 번 더 묻기) · 틀림 */
function answerOf(it) { return hasChunk(it) ? it.chunk : guessChunk(it.meaning, it.meaning) || it.meaning; }
function jamo(s) {
  const L = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ", V = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ",

  let out = "";
  for (const ch of s) {
    const c = ch.charCodeAt(0) - 0xac00;
    if (c < 0 || c > 11171) { out += ch; continue; }
    out += L[Math.floor(c / 588)] + V[Math.floor((c % 588) / 28)] + (c % 28 ? T[c % 28] : "");
  }

}
function nearDist(a, v) {
  let prev = new Array(v.length + 1).fill(0);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= v.length; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === v[j - 1] ? 0 : 1));
    prev = cur;
  }
  return Math.min(...prev);
}

  if (answers.some(a => v === a) || stems.some(s => v.includes(s))) return "right";
  for (const s of stems.concat(answers)) {
    const a = jamo(s), d = nearDist(a, jamo(v));
    if (d <= Math.max(1, Math.floor(a.length * 0.34))) return "close";

}

/* ---------- 기기 동기화 (무료 Firestore, 긴 코드 하나로) ---------- */
const SYNC_URL = "https://firestore.googleapis.com/v1/projects/toeic-words-abb91/databases/(default)/documents/sync/";
const SKEY = "toeic-words-sync";
let sync = (() => { try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { return {}; } })();
function saveSync() { try { localStorage.setItem(SKEY, JSON.stringify(sync)); } catch (e) {} }
function newCode() {
  const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789", r = crypto.getRandomValues(new Uint32Array(24));
  let s = ""; for (let i = 0; i < 24; i++) { if (i && i % 4 === 0) s += "-"; s += A[r[i] % A.length]; } return s;
}
const timeout = () => (window.AbortSignal && AbortSignal.timeout) ? AbortSignal.timeout(15000) : undefined;
const cleanCode = s => String(s).toUpperCase().replace(/[^A-Z0-9]/g, "").replace(/(.{4})(?=.)/g, "$1-");
async function remoteGet(code) {
  const r = await fetch(SYNC_URL + code, { cache: "no-store", signal: timeout() });
  if (r.status === 404 || r.status === 403) return null;
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  return { data: JSON.parse(j.fields.data.stringValue), updatedAt: +j.fields.updatedAt.integerValue };
}
async function remotePut(code) {
  const body = JSON.stringify({ fields: {
    data: { stringValue: JSON.stringify(db) },
    updatedAt: { integerValue: String(db.updatedAt || 0) },
    device: { stringValue: isIOS() ? "iOS" : (navigator.userAgentData && navigator.userAgentData.platform) || "web" } } });
  const r = await fetch(SYNC_URL + code, { method: "PATCH", headers: { "Content-Type": "application/json" }, body, keepalive: body.length < 60000, signal: timeout() });
  if (!r.ok) throw new Error("HTTP " + r.status);
}
let pushTimer = null, syncing = false, again = false;
function schedulePush() { if (!sync.code) return; clearTimeout(pushTimer); pushTimer = setTimeout(syncNow, 800); }
// 더 최근에 바뀐 쪽을 따라감
async function syncNow() {
  if (!sync.code) return;
  if (syncing) { again = true; return; }
  syncing = true;
  try {
    const remote = await remoteGet(sync.code);
    const mine = db.updatedAt || 0;
    if (remote && remote.updatedAt > mine) applyRemote(remote.data);
    else if (!remote || remote.updatedAt < mine) await remotePut(sync.code);
    sync.last = Date.now(); sync.err = "";
  } catch (e) { sync.err = navigator.onLine === false ? "인터넷 없음" : "연결 안 됨"; }
  syncing = false; saveSync();
  if (screen === syncScreen && !S) syncScreen();
  if (again) { again = false; syncNow(); }
}
function applyRemote(data) {
  db = data; normalize(); mergeWords(); saveLocal();
  const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (!S && screen && !typing && !$("#alert")) screen();
}
async function startSync() {
  sync = { code: newCode() }; saveSync();
  db.updatedAt = Date.now(); saveLocal();
  await syncNow(); syncScreen();
}
async function connectCode() {
  const raw = prompt("다른 기기에 나온 동기화 코드를 넣어 주세요.");
  if (!raw) return;
  const code = cleanCode(raw);
  if (code.replace(/-/g, "").length < 20) return alert("코드가 짧아요. 다시 확인해 주세요.");
  try {
    const remote = await remoteGet(code);
    if (!remote) return alert("그 코드를 찾지 못했어요. 다시 확인해 주세요.");
    if (!confirm("이 기기의 기록을 동기화된 기록으로 바꿀까요?")) return;
    sync = { code, last: Date.now() }; saveSync();
    applyRemote(remote.data); syncScreen();
  } catch (e) { alert("인터넷 연결을 확인해 주세요."); }
}
function stopSync() {
  if (!confirm("이 기기만 동기화를 끌까요? 다른 기기와 지금까지의 기록은 그대로예요.")) return;
  sync = {}; saveSync(); syncScreen();
}
async function copyCode(btn) {
  try { await navigator.clipboard.writeText(sync.code); btn.textContent = "복사했어요"; setTimeout(() => { btn.textContent = "코드 복사"; }, 1500); }
  catch (e) { prompt("코드를 길게 눌러 복사하세요.", sync.code); }
}
const timeText = t => { const d = new Date(t); return d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); };
function syncScreen() {
  S = null; screen = syncScreen;
  const head = navbar(backBtn("홈", "home()"), "기기 동기화", "");
  if (!sync.code) return render(head + `
    <div class="sh">처음 켜는 기기</div>
    <div class="group"><button class="cell tint" onclick="startSync()">이 기기에서 동기화 시작</button></div>
    <div class="sf">동기화 코드가 하나 생겨요. 그 코드를 다른 기기에 한 번만 넣으면 별표 · 단어 · 설정이 같이 맞춰져요. 로그인은 필요 없어요.</div>
    <div class="sh">이미 켠 기기가 있으면</div>
    <div class="group"><button class="cell tint" onclick="connectCode()">코드 입력해서 연결</button></div>
    <div class="sf">이 기기의 기록은 동기화된 기록으로 바뀌어요.</div>`);
  render(head + `
    <div class="sh">동기화 코드</div>
    <div class="group">
      <div class="cell"><span class="grow" style="font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:16px;letter-spacing:.5px;user-select:all;-webkit-user-select:all;padding:11px 0">${esc(sync.code)}</span></div>
      <button class="cell tint" onclick="copyCode(this)">코드 복사</button>
    </div>
    <div class="sf">다른 기기에서 이 앱을 열고 「기기 동기화 → 코드 입력해서 연결」에 이 코드를 넣으세요. 비밀번호처럼 남에게 보여 주지 마세요.</div>
    <div class="group" style="margin-top:30px">
      <div class="cell"><span class="grow">상태</span><span class="detail" style="color:${sync.err ? "var(--red)" : "var(--secondary)"}">${
        sync.err ? esc(sync.err) : sync.last ? timeText(sync.last) + "에 맞춤" : "맞추는 중…"}</span></div>
      <button class="cell tint" onclick="syncNow()">지금 맞추기</button>
    </div>
    <div class="group" style="margin-top:30px"><button class="cell danger center" onclick="stopSync()">이 기기 동기화 끄기</button></div>`);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(); });
window.addEventListener("online", () => syncNow());
setInterval(() => { if (document.visibilityState === "visible") syncNow(); }, 30000);

/* ---------- 앱처럼 설치 ---------- */
let installEvt = null;
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (!S) home(); });
window.addEventListener("appinstalled", () => { installEvt = null; if (!S) home(); });
function installRow() {
  if (standalone()) return "";
  if (installEvt) return `<div class="group" style="margin-top:30px"><button class="cell ico" onclick="installApp()">
      <span class="ic" style="background:var(--indigo)">${ICON.book}</span><span class="grow">앱으로 설치</span>${ICON.chev}</button></div>
    <div class="sf">설치하면 아이콘이 생기고 자기 창으로 열려요.</div>`;
  if (isIOS()) return `<div class="group" style="margin-top:30px"><div class="cell ico">
      <span class="ic" style="background:var(--indigo)">${ICON.book}</span><span class="grow two"><div>앱으로 설치</div>
      <div class="sub" style="white-space:normal">사파리 공유 버튼 → 홈 화면에 추가</div></span></div></div>`;
  return "";
}
async function installApp() { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; home(); }
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js");

load(); home(); syncNow();
</script>
</body>
</html>
