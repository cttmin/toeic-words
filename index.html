<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TOEIC Words">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>TOEIC Words</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* iOS 시스템 색 */
  :root {
    --bg: #F2F2F7; --card: #FFFFFF; --label: #000000;
    --secondary: rgba(60,60,67,.6); --tertiary: rgba(60,60,67,.3);
    --sep: rgba(60,60,67,.29); --fill: rgba(118,118,128,.12); --press: #D1D1D6;
    --tint: #007AFF; --green: #34C759; --red: #FF3B30; --orange: #FF9500; --yellow: #FFCC00; --indigo: #5856D6;
    --navbg: rgba(242,242,247,.8); --alertbg: rgba(242,242,242,.82);
    --teal: #30B0C7; --segon: #FFFFFF; --switchoff: #E9E9EA; --menubg: rgba(249,249,249,.82);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: #1C1C1E; --label: #FFFFFF;
      --secondary: rgba(235,235,245,.6); --tertiary: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.65); --fill: rgba(118,118,128,.24); --press: #3A3A3C;
      --tint: #0A84FF; --green: #30D158; --red: #FF453A; --orange: #FF9F0A; --yellow: #FFD60A; --indigo: #5E5CE6;
      --navbg: rgba(22,22,24,.8); --alertbg: rgba(44,44,46,.85);
      --teal: #40C8E0; --segon: #636366; --switchoff: #39393D; --menubg: rgba(40,40,42,.82);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--label); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", Pretendard, "Segoe UI", "Malgun Gothic", sans-serif;
    font-size: 17px; line-height: 1.29; letter-spacing: -0.41px; -webkit-font-smoothing: antialiased;
  }
  button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  /* 아이폰 「두 번 탭 확대」 대기 없애기 → 연타해도 바로 반응 */
  * { touch-action: manipulation; }
  /* 글자 칸은 16px 이상이어야 아이폰이 눌렀을 때 확대하지 않음 */
  input, textarea, select { font-size: max(16px, 1em) !important; }
  .wrap { max-width: 600px; margin: 0 auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }
  .hide { display: none !important; }
  .grow { flex: 1; min-width: 0; }
  svg { display: block; }

  /* 내비게이션 바 */
  .nav { position: sticky; top: 0; z-index: 10; margin: 0 -16px; padding: env(safe-area-inset-top) 8px 0;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px;
    background: var(--navbg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
  .nav.line { box-shadow: 0 .5px 0 var(--sep); }
  .nav .nl { justify-self: start; } .nav .nr { justify-self: end; }
  .nav .nt { font-weight: 600; text-align: center; white-space: nowrap; }
  .bar-btn { display: flex; align-items: center; gap: 3px; height: 44px; padding: 0 8px; border: 0; background: none; color: var(--tint); font-size: 17px; }
  .bar-btn:active { opacity: .3; }
  .bar-btn svg { width: 12px; height: 21px; }
  .bar-txt { padding: 0 8px; color: var(--secondary); font-variant-numeric: tabular-nums; }
  .large { font-size: 34px; font-weight: 700; letter-spacing: .37px; line-height: 1.2; margin: 2px 0 0; }
  .progress { height: 3px; background: var(--fill); margin: 0 -16px; }
  .progress > div { height: 100%; background: var(--tint); transition: width .25s ease-out; }

  /* 묶음 목록 (inset grouped) */
  .sh { font-size: 13px; line-height: 18px; letter-spacing: -0.08px; color: var(--secondary); text-transform: uppercase; padding: 0 16px 7px; margin-top: 30px; }
  .sf { font-size: 13px; line-height: 18px; letter-spacing: -0.08px; color: var(--secondary); padding: 7px 16px 0; }
  .group { background: var(--card); border-radius: 10px; overflow: hidden; }
  .group + .group { margin-top: 30px; }
  .cell { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 16px;
    background: var(--card); border: 0; text-align: left; color: var(--label); font-size: 17px; }
  .cell + .cell::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 16px); height: .5px; background: var(--sep); }
  .cell.ico + .cell.ico { --inset: 57px; }
  button.cell:active { background: var(--press); }
  button.cell:disabled { opacity: .4; }
  .cell .detail { color: var(--secondary); font-variant-numeric: tabular-nums; }
  .cell .two { padding: 11px 0; }
  .cell .sub { font-size: 13px; color: var(--secondary); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -0.08px; }
  .cell.tint { color: var(--tint); } .cell.danger { color: var(--red); } .cell.center { justify-content: center; }
  .chev { width: 8px; height: 13px; color: var(--tertiary); flex: none; }
  .check { width: 16px; height: 14px; color: var(--tint); flex: none; }
  .check.off { visibility: hidden; }
  .ic { width: 29px; height: 29px; border-radius: 7px; display: grid; place-items: center; color: #fff; font-size: 15px; font-weight: 600; flex: none; }
  .ic svg { width: 18px; height: 18px; }

  .stepper { display: flex; align-items: center; height: 32px; background: var(--fill); border-radius: 8px; flex: none; }
  .stepper button { width: 46px; height: 32px; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--label); }
  .stepper button:active { opacity: .3; }
  .stepper i { width: 1px; height: 18px; background: var(--sep); }
  .cell input.count { flex: none; width: 52px; height: 32px; padding: 0 6px; margin-right: -6px; border-radius: 8px; background: var(--fill);
    text-align: right; font-size: 17px; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
  .cell input.count::-webkit-outer-spin-button, .cell input.count::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .cell input.count:focus { box-shadow: 0 0 0 2px var(--tint); }

  /* 버튼 */
  .btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 50px; border: 0; border-radius: 12px;
    background: var(--tint); color: #fff; font-size: 17px; font-weight: 600; }
  .btn.gray { background: var(--fill); color: var(--tint); }
  .btn:active { opacity: .7; }
  .btn:disabled { opacity: .35; }
  .btns { display: flex; gap: 10px; margin-top: 20px; }
  .stack { margin-top: 24px; } .stack .btn + .btn { margin-top: 10px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 12px; border: 0; border-radius: 16px;
    background: var(--fill); color: var(--tint); font-size: 15px; font-weight: 600; }
  .pill:active { opacity: .5; }
  .pill svg { width: 17px; height: 17px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

  /* 공부 카드 */
  .card { background: var(--card); border-radius: 12px; padding: 20px 16px; margin-top: 16px; animation: in .25s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .card-head { display: flex; align-items: flex-start; gap: 12px; }
  .word { font-size: 28px; font-weight: 700; letter-spacing: .36px; line-height: 1.2; margin: 0; }
  .meaning { color: var(--secondary); margin: 4px 0 0; }
  .hr { height: .5px; background: var(--sep); margin: 16px 0; }
  .sent { font-size: 19px; line-height: 1.42; letter-spacing: -0.45px; margin: 0; }
  .trans { font-size: 16px; line-height: 1.45; color: var(--secondary); margin: 10px 0 0; letter-spacing: -0.3px; }
  mark { background: none; color: var(--tint); font-weight: 600; }
  .blank { display: inline-block; min-width: 56px; border-bottom: 2px solid var(--tint); }
  .star { border: 0; background: none; padding: 4px; margin: -4px -4px 0 auto; color: var(--tertiary); flex: none; }
  .star svg { width: 24px; height: 24px; transition: transform .2s ease-out; }
  .star path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
  .star.on { color: var(--yellow); }
  .star.on path { fill: currentColor; }
  .star.on svg { transform: scale(1.06); }
  .head-btns { display: flex; align-items: center; gap: 2px; margin: -4px -4px 0 auto; flex: none; }
  .head-btns .star { margin: 0; }
  .known { border: 0; background: none; padding: 4px; color: var(--tertiary); flex: none; }
  .known svg { width: 24px; height: 24px; transition: transform .2s ease-out; }
  .known circle, .known path { transition: fill .2s ease-out, stroke .2s ease-out; }
  .known.on { color: var(--green); }
  .known.on circle { fill: currentColor; }
  .known.on path { stroke: #fff; }
  .known.on svg { transform: scale(1.06); }
  .wrow.is-known .w, .wrow.is-known .m { opacity: .45; }
  /* iOS 스위치 */
  .cell input.switch { -webkit-appearance: none; appearance: none; flex: none; width: 51px; height: 31px; margin: 0; border-radius: 16px;
    background: var(--switchoff); position: relative; cursor: pointer; transition: background .2s ease-out; }
  .cell input.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06); transition: transform .2s ease-out; }
  .cell input.switch:checked { background: var(--green); }
  .cell input.switch:checked::after { transform: translateX(20px); }

  .choice { padding: 11px 16px; line-height: 1.35; letter-spacing: -0.3px; font-size: 16px; }
  .choice .mark { width: 18px; height: 18px; flex: none; }
  .choice.right { color: var(--green); font-weight: 600; }
  .choice.wrong { color: var(--red); }
  .cell input, .cell select { flex: 1; min-width: 0; height: 44px; border: 0; background: none; outline: none; font-size: 17px; color: var(--label); }
  .cell input::placeholder, textarea::placeholder { color: var(--tertiary); }
  .cell .lab { width: 92px; flex: none; }
  .cell select { -webkit-appearance: none; appearance: none; text-align: right; text-align-last: right; color: var(--secondary); padding: 0; }
  .cell textarea { width: 100%; min-height: 132px; border: 0; outline: none; resize: vertical; background: none; padding: 11px 0; font-size: 15px; line-height: 1.4; }
  .fb { font-size: 15px; padding: 10px 16px 0; color: var(--secondary); min-height: 28px; }
  .fb b { color: var(--label); font-weight: 600; }
  .fb.ok { color: var(--green); font-weight: 600; }

  /* 단어장 */
  .seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin-top: 20px; }
  .seg button { flex: 1; min-width: 0; padding: 0 4px; white-space: nowrap; height: 30px; border: 0; border-radius: 7px; background: none; font-size: 13px; font-weight: 600; color: var(--label); transition: background .2s ease-out; }
  .seg button.on { background: var(--segon); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); }
  .wrow { cursor: pointer; }
  .wrow .w { font-weight: 600; letter-spacing: -0.2px; }
  .wrow .m { font-size: 15px; color: var(--secondary); margin-top: 3px; border-radius: 5px; transition: color .2s ease-out, background .2s ease-out; }
  .hide-m .wrow .m { color: transparent; background: var(--fill); width: fit-content; min-width: 96px; user-select: none; }
  .hide-m .wrow.show .m { color: var(--secondary); background: none; }
  .spk { border: 0; background: none; color: var(--tint); padding: 8px; margin-left: -8px; flex: none; }
  .spk svg { width: 20px; height: 20px; }
  .spk:active { opacity: .3; }

  /* 단어 관리 */
  .sf { white-space: pre-line; }
  .small-title { opacity: 0; transition: opacity .2s ease-out; }
  .nav.titled .small-title { opacity: 1; }
  .nav { transition: box-shadow .2s ease-out; }
  .nav .nt { overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
  .bar-btn:disabled { color: var(--tertiary); opacity: 1; }
  .minus { color: var(--red); flex: none; line-height: 0; }
  .minus svg { width: 22px; height: 22px; }
  .cell textarea.ta { min-height: 0; resize: none; padding: 11px 0; font-size: 17px; line-height: 1.35; overflow: hidden; }
  .cell input { font-size: 17px; }

  /* 풀다운 메뉴 (UIMenu) */
  .updown { color: var(--tertiary); flex: none; line-height: 0; margin-left: -4px; }
  .updown svg { width: 10px; height: 16px; }
  .menu-bg { position: fixed; inset: 0; z-index: 60; }
  .menu { position: fixed; min-width: 230px; max-width: 290px; max-height: 55vh; overflow-y: auto; overscroll-behavior: contain;
    border-radius: 13px; background: var(--menubg); -webkit-backdrop-filter: saturate(180%) blur(30px); backdrop-filter: saturate(180%) blur(30px);
    box-shadow: 0 12px 40px rgba(0,0,0,.22), 0 0 0 .5px rgba(0,0,0,.06); transform-origin: top right; animation: menuIn .25s ease-out; }
  .menu.up { transform-origin: bottom right; }
  .menu button { display: flex; align-items: center; gap: 6px; width: 100%; min-height: 44px; padding: 0 16px 0 10px; border: 0; background: none;
    font-size: 17px; color: var(--label); text-align: left; position: relative; }
  .menu button + button::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: .5px; background: var(--sep); }
  .menu button:active { background: rgba(127,127,127,.18); }
  .menu .mchk { width: 22px; flex: none; color: var(--label); }
  .menu .mchk svg { width: 14px; height: 12px; }
  .menu .msub { color: var(--secondary); font-size: 15px; font-variant-numeric: tabular-nums; }
  @keyframes menuIn { from { opacity: 0; transform: scale(.85); } }

  /* 화면 넘어가기 (밀려 들어오기 · 돌아가기) */
  #app.push { animation: pushIn .35s cubic-bezier(.2,.8,.2,1); }
  #app.pop { animation: popIn .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes pushIn { from { transform: translateX(32%); opacity: .3; } }
  @keyframes popIn { from { transform: translateX(-24%); opacity: .3; } }

  /* 아래에서 올라오는 창 (iOS 시트) */
  .sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.28); animation: fade .25s ease-out; transition: opacity .25s ease-out; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; top: calc(env(safe-area-inset-top) + 12px); max-width: 600px; margin: 0 auto;
    background: var(--bg); border-radius: 12px 12px 0 0; display: flex; flex-direction: column; animation: up .3s ease-out; transition: transform .25s ease-out;
    box-shadow: 0 -1px 0 rgba(0,0,0,.04); }
  .sheet .nav { position: static; margin: 0; padding: 6px 8px 0; border-radius: 12px 12px 0 0; background: var(--bg); box-shadow: 0 .5px 0 var(--sep); }
  .sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }
  .sheet-bg.out { opacity: 0; }
  .sheet-bg.out .sheet { transform: translateY(100%); }
  @keyframes up { from { transform: translateY(100%); } }

  /* 알림창 (UIAlertController) */
  .alert-bg { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(0,0,0,.2); animation: fade .2s ease-out; }
  .alert { width: 270px; border-radius: 14px; overflow: hidden; text-align: center; background: var(--alertbg);
    -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); animation: pop .2s ease-out; }
  .alert .at { font-size: 17px; font-weight: 600; padding: 19px 16px 2px; }
  .alert .am { font-size: 13px; line-height: 18px; padding: 0 16px 19px; letter-spacing: -0.08px; }
  .alert .ab { display: flex; box-shadow: 0 -.5px 0 var(--sep); }
  .alert .ab button { flex: 1; height: 44px; border: 0; background: none; color: var(--tint); font-size: 17px; }
  .alert .ab button + button { box-shadow: -.5px 0 0 var(--sep); }
  .alert .ab button:active { background: rgba(127,127,127,.15); }
  .alert .ab .b { font-weight: 600; }
  .alert .ab .danger { color: var(--red); }
  .alert .ab.col { flex-direction: column; }
  .alert .ab.col button + button { box-shadow: 0 -.5px 0 var(--sep); }
  .alert .am { white-space: pre-line; }
  .alert .af { padding: 0 16px 16px; margin-top: -4px; }
  .alert .af input { width: 100%; height: 34px; padding: 0 8px; border: .5px solid var(--sep); border-radius: 7px;
    background: var(--card); color: var(--label); outline: none; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(1.12); } }

  .done { text-align: center; padding: 40px 0 8px; }
  .done .circle { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 16px; display: grid; place-items: center; color: #fff; }
  .done .circle svg { width: 34px; height: 34px; }
  .done .big { font-size: 34px; font-weight: 700; letter-spacing: .37px; font-variant-numeric: tabular-nums; }
  .done .small { color: var(--secondary); margin-top: 4px; font-size: 15px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="words.js"></script>
<script>
/* ---------- 아이콘 (SF Symbols 느낌) ---------- */
const ICON = {
  back: `<svg viewBox="0 0 12 21"><path d="M10 2L2 10.5 10 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  chev: `<svg class="chev" viewBox="0 0 8 13"><path d="M1.5 1.5L6.5 6.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  check: `<svg viewBox="0 0 16 14"><path d="M1.6 7.6l4.4 4.4L14.4 1.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  checkC: `<svg class="mark" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="currentColor"/><path d="M5.5 10.3l3 3 6-6.3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  xC: `<svg class="mark" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="currentColor"/><path d="M6.5 6.5l7 7M13.5 6.5l-7 7" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`,
  star: `<svg viewBox="0 0 24 24"><path d="M12 3.4l2.62 5.32 5.88.86-4.25 4.14 1 5.85L12 16.8l-5.25 2.77 1-5.85L3.5 9.58l5.88-.86z"/></svg>`,
  starF: `<svg viewBox="0 0 24 24"><path d="M12 3.4l2.62 5.32 5.88.86-4.25 4.14 1 5.85L12 16.8l-5.25 2.77 1-5.85L3.5 9.58l5.88-.86z" fill="currentColor"/></svg>`,
  knownC: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.8 12.3l2.8 2.8 5.6-5.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  updown: `<svg viewBox="0 0 10 16"><path d="M1.8 5.6L5 2.4l3.2 3.2M1.8 10.4L5 13.6l3.2-3.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  plus: `<svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  minus: `<svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="10" fill="currentColor"/><rect x="6" y="10" width="10" height="2.2" rx="1.1" fill="#fff"/></svg>`,
  play: `<svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>`,
  speaker: `<svg viewBox="0 0 24 24"><path d="M3.5 9.2h3.3L11.5 5v14l-4.7-4.2H3.5z" fill="currentColor"/><path d="M15 8.6a4.8 4.8 0 010 6.8M17.6 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  tortoise: `<svg viewBox="0 0 24 24"><path d="M3.5 9.2h3.3L11.5 5v14l-4.7-4.2H3.5z" fill="currentColor"/><path d="M15 9.5a3.5 3.5 0 010 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  book: `<svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4.5 9.5 4.6 12 6.2c2.5-1.6 5.5-1.7 8-.7v13c-2.5-1-5.5-.9-8 .7-2.5-1.6-5.5-1.7-8-.7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 6.2v13" stroke="currentColor" stroke-width="1.8"/></svg>`,

/* ---------- 저장 ---------- */
const KEY = "toeic-words-v1";
const MY = "내 단어"; // 챕터 없이 직접 만든 Day 가 들어가는 챕터
// 지금 고른 챕터 (없으면 첫 챕터)
function chapters() { return [...new Set(db.days.map(d => d.chapter))]; }
function curChapter() { const cs = chapters(); return cs.includes(db.chapter) ? db.chapter : cs[0]; }
const chapterDays = () => db.days.filter(d => d.chapter === curChapter());
let db;
const keyOf = it => it.word.toLowerCase() + "||" + it.sentence;

function load() {
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) { db = null; }
  normalize();
  mergeWords();
  saveLocal();
}
function normalize() {
  if (!db || !Array.isArray(db.days)) db = { days: [], count: 10, picked: ["Day 1"], seen: [] };
  if (!db.marked) db.marked = [];
  if (!db.picked) db.picked = [];
  if (!db.count) db.count = 10;
  if (!db.removed) db.removed = [];
  if (!db.known) db.known = [];
  if (db.skipKnown === undefined) db.skipKnown = true;
  for (const d of db.days) if (!d.chapter) d.chapter = MY;
  if (!db.seen) db.seen = db.days.flatMap(d => d.items.map(it => d.name + "||" + it.word.toLowerCase()));
}
// words.js 에 새로 생긴 단어만 앱에 넣기 (앱에서 지운 건 다시 안 넣음)
function mergeWords() {
  // 예전에 뺀 Day 는 한 번 지움 (나중에 같은 이름으로 다시 만들면 그건 그대로 둠)
  if (typeof REMOVED_DAYS !== "undefined") for (const name of REMOVED_DAYS) {
    if (db.removed.includes(name)) continue;
    db.days = db.days.filter(d => d.name !== name);
    db.picked = db.picked.filter(x => x !== name);
    db.removed.push(name);
  }
  if (typeof WORDS === "undefined") return;
  // 이름을 바꾼 챕터 · Day 도 원래 이름으로 찾아서, 바꾼 이름이 되돌아가지 않게
  const alias = db.chapterAlias || {};
  const chName = c => alias[c] || c;
  for (const d of WORDS) {
    let day = db.days.find(x => (x.orig || x.name) === d.day);
    if (day && d.chapter && day.chapterOrig !== d.chapter) { day.chapter = chName(d.chapter); day.chapterOrig = d.chapter; }
    for (const a of d.items) {
      const k = d.day + "||" + a[0].trim().toLowerCase();
      if (db.seen.includes(k)) continue;
      if (!day) { day = { name: d.day, orig: d.day, chapter: chName(d.chapter || MY), chapterOrig: d.chapter, items: [] }; db.days.push(day); }
      day.items.push(toItem(a)); db.seen.push(k);
    }
  }
  // 고른 챕터에 체크된 Day 가 하나도 없으면 첫 Day 를 골라 둠
  const cds = chapterDays();
  if (cds.length && !cds.some(d => db.picked.includes(d.name))) db.picked.push(cds[0].name);
}
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
// 사용자가 뭔가 바꿨을 때: 이 기기에 저장 + 다른 기기로 보내기
function save() { db.updatedAt = Date.now(); saveLocal(); schedulePush(); }
function toItem(a) {
  return { word: a[0].trim(), meaning: (a[1] || "").trim(), sentence: (a[2] || "").trim(),
           translation: (a[3] || "").trim(), chunk: (a[4] || "").trim() || guessChunk(a[1], a[3]) };
}
function guessChunk(meaning, translation) {
  meaning = (meaning || "").split(/[,;/]/)[0].trim();
  const stem = meaning.replace(/(하다|되다|시키다|이다|한|하게|적인|적으로)$/, "");
  return translation && stem && translation.includes(stem) ? stem : "";
}

/* ---------- 도우미 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).toLowerCase().replace(/[\s.,'’"!?~·-]/g, "");
const allItems = () => db.days.flatMap(d => d.items);
// 스크롤 위치: 같은 화면을 다시 그리면 그대로, 다른 화면에 갔다 돌아오면 보던 자리로

const scrollMem = new Map();
// 화면 깊이: 더 깊이 들어가면 오른쪽에서 밀려 들어오고, 나오면 왼쪽에서 돌아옴 (아이폰처럼)

    app.classList.remove("push", "pop"); void app.offsetWidth; app.classList.add(d > prevDepth ? "push" : "pop");
  }

}
// 큰 제목이 가려질 만큼 내리면 위쪽 막대에 작은 제목이 나타남 (아이폰 기본 앱처럼)

// 화면 왼쪽 끝에서 오른쪽으로 밀면 뒤로 가기
let swipeX = null, swipeY = 0;
addEventListener("touchstart", e => { const t = e.touches[0]; swipeX = t.clientX < 28 ? t.clientX : null; swipeY = t.clientY; }, { passive: true });
addEventListener("touchend", e => {
  if (swipeX === null) return;
  const t = e.changedTouches[0], dx = t.clientX - swipeX, dy = Math.abs(t.clientY - swipeY); swipeX = null;
  if (dx < 70 || dy > 60 || $("#sheet") || $("#dlg") || $("#alert") || $("#menu")) return;

// 예문 속에서 단어가 실제로 쓰인 모양 찾기: postpone → postponed, be responsible for → is responsible for
const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function formInSentence(it) {
  const raw = it.word.trim().split(/\s+/);
  if (raw.length > 1) {
    const parts = raw.map((t, i) => {
      if (/^[AB]$/.test(t)) return i === raw.length - 1 ? "[\\w'’-]+" : "[\\w'’ -]+?";
      const l = t.toLowerCase();
      if (l === "be") return "(?:be|is|are|was|were|been|being|am)";
      if (l === "oneself") return "\\w+sel(?:f|ves)";
      return reEsc(l.length > 3 ? l.replace(/[ey]$/, "") : l) + "[a-zé'’-]*";
    });
    const m = it.sentence.match(new RegExp("(?:^|[^\\w])(" + parts.join("\\s+") + ")", "i"));
    if (m) return m[1];
  }
  const w = it.word.toLowerCase();
  const tries = [w, w.replace(/e$/, ""), w.replace(/y$/, "i"), w.slice(0, Math.max(3, w.length - 2))];
  for (const t of tries) {
    const m = it.sentence.match(new RegExp("(?:^|[^\\wé])(" + reEsc(t) + "[a-zé]*)", "i"));
    if (m) return m[1];
  }
  return null;
}
function markSentence(it) {
  const f = formInSentence(it); const s = esc(it.sentence);
  return f ? s.replace(esc(f), "<mark>" + esc(f) + "</mark>") : s;
}
const hasChunk = it => it.chunk && it.translation.includes(it.chunk);
function markTranslation(it, blank) {
  const t = esc(it.translation);
  if (!hasChunk(it)) return t;
  return t.replace(esc(it.chunk), blank ? '<span class="blank">&nbsp;</span>' : "<mark>" + esc(it.chunk) + "</mark>");
}

/* ---------- 애플 알림창 (입력 · 확인 · 안내) : 브라우저 기본 창 대신 ---------- */
function iosDialog({ title, message = "", input = null, buttons }) {
  return new Promise(resolve => {
    const old = $("#dlg"); if (old) old.remove();
    document.activeElement && document.activeElement.blur();
    document.body.insertAdjacentHTML("beforeend", `<div class="alert-bg" id="dlg"><div class="alert" role="dialog">
      <div class="at">${esc(title)}</div>
      ${message ? `<div class="am">${esc(message)}</div>` : `<div style="height:16px"></div>`}
      ${input ? `<div class="af"><input type="text" id="dlgIn" value="${esc(input.value || "")}" placeholder="${esc(input.placeholder || "")}" autocomplete="off" enterkeyhint="done"></div>` : ""}
      <div class="ab ${buttons.length > 2 ? "col" : ""}">${buttons.map((b, i) => `<button data-i="${i}" class="${b.bold ? "b" : ""} ${b.danger ? "danger" : ""}">${esc(b.label)}</button>`).join("")}</div>
    </div></div>`);
    const box = $("#dlg"), inp = $("#dlgIn");
    const done = v => { box.remove(); resolve(v); };
    box.querySelectorAll(".ab button").forEach(btn => btn.onclick = () => {
      const b = buttons[+btn.dataset.i]; done(b.value === "input" ? inp.value.trim() : b.value);
    });
    if (inp) {
      setTimeout(() => { inp.focus(); inp.select(); }, 60);
      inp.onkeydown = e => { if (e.key === "Enter" && !e.isComposing) done(inp.value.trim()); };
    }
  });
}

function showMenu(anchor, items, onPick) {

  const right = Math.max(8, Math.round(vw - r.right - 8));

/* ---------- 별표 ---------- */
const isMarked = it => db.marked.includes(keyOf(it));
function setMark(it, on) {
  const k = keyOf(it);

  if (on) { db.marked.push(k); db.known = db.known.filter(x => x !== k); } // 별표 = 아직 모름

}
/* ---------- 아는 단어 (✓) : 공부에서 빠짐 ---------- */
const isKnown = it => db.known.includes(keyOf(it));
function setKnown(it, on) {
  const k = keyOf(it);
  db.known = db.known.filter(x => x !== k);
  if (on) { db.known.push(k); db.marked = db.marked.filter(x => x !== k); } // 알면 별표는 풀림

let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => /^en(-|_)/i.test(v.lang));
  const pref = [/natural/i, /samantha/i, /google us english/i, /aria|jenny|guy/i, /en-us/i];
  for (const p of pref) { const v = vs.find(v => p.test(v.name) || p.test(v.lang)); if (v) return (voice = v); }
  voice = vs[0] || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, rate = 0.95) {
  if (!("speechSynthesis" in window)) return tell("읽어 주기를 쓸 수 없어요", "이 브라우저는 읽어 주기를 지원하지 않아요.");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice; u.lang = voice ? voice.lang : "en-US"; u.rate = rate;
  speechSynthesis.speak(u);
}

// 뜻의 첫 낱말 끝으로 말의 종류 가늠: 동사 · 꾸밈말 · 부사 · 명사
function wordKind(it) {
  const m = (it.meaning || "").split(/[,;/]/)[0].trim();
  if (/다$/.test(m)) return "v";
  if (/(한|운|인|은|는|된|의|던|찬|난|린|른|쁜|픈|큰|든)$/.test(m)) return "a";
  if (/ly$/i.test(it.word) || /^(now|together|after all|in a while|for free|indoors|elsewhere)$/i.test(it.word)) return "d";
  return "n";
}
// 해석에서 단어 뜻 바로 뒤에 붙는 글자 (하/되 꼴은 한 묶음): 이게 같아야 바꿔 넣어도 문장이 자연스러움
function tailOf(p) {
  const c = p.translation.charAt(p.translation.indexOf(p.chunk) + p.chunk.length);
  if (/[하한할합해했함되된될됩돼됐됨]/.test(c)) return "하";
  return c || " ";
}
// 헷갈리는 보기: 정답 해석에서 단어 뜻만 다른 단어 뜻으로 바꾼 문장
function distractors(it) {
  const pool = allItems(); const out = new Set();
  const day = db.days.find(d => d.items.some(x => keyOf(x) === keyOf(it)));
  const sameDay = day ? day.items : [];
  if (hasChunk(it)) {
    // 같은 종류의 말(동사끼리 · 명사끼리)만, 같은 Day 것을 먼저 써서 더 헷갈리게
    const kind = wordKind(it), tail = tailOf(it);
    const fits = p => hasChunk(p) && wordKind(p) === kind && tailOf(p) === tail;
    const pick = list => shuffle([...new Set(list.filter(fits).map(p => p.chunk).filter(c => c !== it.chunk && !c.includes(it.chunk) && !it.chunk.includes(c)))]);
    const chunks = [...new Set([...pick(sameDay), ...pick(pool)])];
    for (const c of chunks) { if (out.size >= 3) break; out.add(it.translation.replace(it.chunk, c)); }
  }
  for (const p of shuffle(pool)) { if (out.size >= 3) break; if (p.translation && p.translation !== it.translation) out.add(p.translation); }

/* 채점: 맞음 · 비슷함(한 번 더 묻기) · 틀림 */
function answerOf(it) { return hasChunk(it) ? it.chunk : guessChunk(it.meaning, it.meaning) || it.meaning; }

        T = " ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ";
  let out = "";
  for (const ch of s) {
    const c = ch.charCodeAt(0) - 0xac00;
    if (c < 0 || c > 11171) { out += ch; continue; }
    out += L[Math.floor(c / 588)] + V[Math.floor((c % 588) / 28)] + (c % 28 ? T[c % 28] : "");

    for (let j = 1; j <= v.length; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === v[j - 1] ? 0 : 1));

  const stems = answers.map(a => a.replace(/(하다|되다|시키다)$/, "")).filter(Boolean);

  for (const s of stems.concat(answers)) {

/* ---------- 기기 동기화 (무료 Firestore, 긴 코드 하나로) ---------- */
const SYNC_URL = "https://firestore.googleapis.com/v1/projects/toeic-words-abb91/databases/(default)/documents/sync/";
const SKEY = "toeic-words-sync";
let sync = (() => { try { return JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { return {}; } })();
function saveSync() { try { localStorage.setItem(SKEY, JSON.stringify(sync)); } catch (e) {} }
function newCode() {
  const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789", r = crypto.getRandomValues(new Uint32Array(24));
  let s = ""; for (let i = 0; i < 24; i++) { if (i && i % 4 === 0) s += "-"; s += A[r[i] % A.length]; } return s;
}
const timeout = () => (window.AbortSignal && AbortSignal.timeout) ? AbortSignal.timeout(15000) : undefined;
const cleanCode = s => String(s).toUpperCase().replace(/[^A-Z0-9]/g, "").replace(/(.{4})(?=.)/g, "$1-");
async function remoteGet(code) {
  const r = await fetch(SYNC_URL + code, { cache: "no-store", signal: timeout() });
  if (r.status === 404 || r.status === 403) return null;
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  return { data: JSON.parse(j.fields.data.stringValue), updatedAt: +j.fields.updatedAt.integerValue };
}
async function remotePut(code) {
  const body = JSON.stringify({ fields: {
    data: { stringValue: JSON.stringify(db) },
    updatedAt: { integerValue: String(db.updatedAt || 0) },
    device: { stringValue: isIOS() ? "iOS" : (navigator.userAgentData && navigator.userAgentData.platform) || "web" } } });
  const r = await fetch(SYNC_URL + code, { method: "PATCH", headers: { "Content-Type": "application/json" }, body, keepalive: body.length < 60000, signal: timeout() });
  if (!r.ok) throw new Error("HTTP " + r.status);
}
let pushTimer = null, syncing = false, again = false;
function schedulePush() { if (!sync.code) return; clearTimeout(pushTimer); pushTimer = setTimeout(syncNow, 800); }
// 더 최근에 바뀐 쪽을 따라감
async function syncNow() {
  if (!sync.code) return;
  if (syncing) { again = true; return; }
  syncing = true;
  try {
    const remote = await remoteGet(sync.code);
    const mine = db.updatedAt || 0;
    if (remote && remote.updatedAt > mine) applyRemote(remote.data);
    else if (!remote || remote.updatedAt < mine) await remotePut(sync.code);
    sync.last = Date.now(); sync.err = "";
  } catch (e) { sync.err = navigator.onLine === false ? "인터넷 없음" : "연결 안 됨"; }
  syncing = false; saveSync();
  if (screen === syncScreen && !S) syncScreen();
  if (again) { again = false; syncNow(); }
}
function applyRemote(data) {
  db = data; normalize(); mergeWords(); saveLocal();
  const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (!S && screen && !typing && !$("#alert") && !$("#dlg") && !$("#sheet")) screen();
}
async function startSync() {
  sync = { code: newCode() }; saveSync();
  db.updatedAt = Date.now(); saveLocal();
  await syncNow(); syncScreen();
}
async function connectCode() {
  const raw = await askText("코드 입력", "다른 기기에 나온 동기화 코드를 넣어 주세요.", "", "ABCD-EFGH-…", "연결");
  if (!raw) return;
  const code = cleanCode(raw);
  if (code.replace(/-/g, "").length < 20) return tell("코드가 짧아요", "다시 확인해 주세요.");
  if (code === sync.code) return tell("이미 이 코드로 연결돼 있어요");
  let remote;
  try { remote = await remoteGet(code); } catch (e) { return tell("연결하지 못했어요", "인터넷 연결을 확인해 주세요."); }
  if (!remote) return tell("코드를 찾지 못했어요", "다시 확인해 주세요.");
  const how = await iosDialog({ title: "기록 합치기", message: "이 기기의 기록과 코드의 기록을\n어떻게 할까요?", buttons: [
    { label: "둘 다 합치기", value: "merge", bold: true },
    { label: "코드 기록으로 바꾸기", value: "replace" },
    { label: "취소", value: null }] });
  if (!how) return;
  sync = { code, last: Date.now() }; saveSync();
  if (how === "replace") applyRemote(remote.data);
  else { db = mergeData(remote.data, db); normalize(); mergeWords(); save(); }
  syncScreen();
  tell("연결했어요", how === "merge" ? "두 기기의 별표 · ✓ · 단어가 합쳐졌어요." : "");
}
// 두 기록 합치기: 별표 · ✓ · 직접 넣은 단어 · Day 는 모두 살리고, 이어서 하기는 더 최근 것
function mergeData(a, b) {
  const out = JSON.parse(JSON.stringify(a)), uni = (x, y) => [...new Set([...(x || []), ...(y || [])])];
  out.marked = uni(a.marked, b.marked);
  out.known = uni(a.known, b.known).filter(k => !out.marked.includes(k)); // 한쪽이라도 별표면 아직 모르는 단어
  out.seen = uni(a.seen, b.seen); out.removed = uni(a.removed, b.removed);
  out.picked = uni(a.picked, b.picked);
  out.chapterAlias = Object.assign({}, b.chapterAlias, a.chapterAlias);
  out.days = out.days || [];
  for (const d of b.days || []) {
    const same = out.days.find(x => x.name === d.name);
    if (!same) { out.days.push(JSON.parse(JSON.stringify(d))); continue; }
    for (const it of d.items) if (!same.items.some(x => keyOf(x) === keyOf(it))) same.items.push(it);
  }
  const sa = a.session, sb = b.session;
  out.session = !sa ? sb || null : !sb ? sa : (sa.at >= sb.at ? sa : sb);
  return out;
}
async function stopSync() {
  if (!await askOK("동기화 끄기", "이 기기만 동기화를 꺼요.\n다른 기기와 지금까지의 기록은 그대로예요.", "끄기", true)) return;
  sync = {}; saveSync(); syncScreen();
}
async function copyCode(btn) {
  try { await navigator.clipboard.writeText(sync.code); btn.textContent = "복사했어요"; setTimeout(() => { btn.textContent = "코드 복사"; }, 1500); }
  catch (e) { askText("동기화 코드", "아래 코드를 길게 눌러 복사하세요.", sync.code, "", "닫기"); }
}
const timeText = t => { const d = new Date(t); return d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); };
function syncScreen() {
  S = null; screen = syncScreen;
  const head = navbar(backBtn("홈", "home()"), "기기 동기화", "");
  if (!sync.code) return render(head + `
    <div class="sh">처음 켜는 기기</div>
    <div class="group"><button class="cell tint" onclick="startSync()">이 기기에서 동기화 시작</button></div>
    <div class="sf">동기화 코드가 하나 생겨요. 그 코드를 다른 기기에 한 번만 넣으면 별표 · 단어 · 설정이 같이 맞춰져요. 로그인은 필요 없어요.</div>
    <div class="sh">이미 켠 기기가 있으면</div>
    <div class="group"><button class="cell tint" onclick="connectCode()">코드 입력해서 연결</button></div>
    <div class="sf">이 기기의 기록은 동기화된 기록으로 바뀌어요.</div>`);
  render(head + `
    <div class="sh">동기화 코드</div>
    <div class="group">
      <div class="cell"><span class="grow" style="font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:16px;letter-spacing:.5px;user-select:all;-webkit-user-select:all;padding:11px 0">${esc(sync.code)}</span></div>
      <button class="cell tint" onclick="copyCode(this)">코드 복사</button>
    </div>
    <div class="sf">다른 기기에서 이 앱을 열고 「기기 동기화 → 코드 입력해서 연결」에 이 코드를 넣으세요. 비밀번호처럼 남에게 보여 주지 마세요.</div>
    <div class="group" style="margin-top:30px">
      <div class="cell"><span class="grow">상태</span><span class="detail" style="color:${sync.err ? "var(--red)" : "var(--secondary)"}">${
        sync.err ? esc(sync.err) : sync.last ? timeText(sync.last) + "에 맞춤" : "맞추는 중…"}</span></div>
      <button class="cell tint" onclick="syncNow()">지금 맞추기</button>
    </div>
    <div class="sh">다른 기기와 코드가 다르면</div>
    <div class="group"><button class="cell tint" onclick="connectCode()">다른 코드로 연결</button></div>
    <div class="sf">다른 기기에 나온 코드를 넣으면 그 코드로 옮겨 가요. 이 기기 기록은 합칠 수 있어요.</div>
    <div class="group" style="margin-top:30px"><button class="cell danger center" onclick="stopSync()">이 기기 동기화 끄기</button></div>`);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(); });
window.addEventListener("online", () => syncNow());
setInterval(() => { if (document.visibilityState === "visible") syncNow(); }, 30000);

/* ---------- 앱처럼 설치 ---------- */
let installEvt = null;
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (!S) home(); });
window.addEventListener("appinstalled", () => { installEvt = null; if (!S) home(); });
function installRow() {
  if (standalone()) return "";
  if (installEvt) return `<div class="group" style="margin-top:30px"><button class="cell ico" onclick="installApp()">
      <span class="ic" style="background:var(--indigo)">${ICON.book}</span><span class="grow">앱으로 설치</span>${ICON.chev}</button></div>
    <div class="sf">설치하면 아이콘이 생기고 자기 창으로 열려요.</div>`;
  if (isIOS()) return `<div class="group" style="margin-top:30px"><div class="cell ico">
      <span class="ic" style="background:var(--indigo)">${ICON.book}</span><span class="grow two"><div>앱으로 설치</div>
      <div class="sub" style="white-space:normal">사파리 공유 버튼 → 홈 화면에 추가</div></span></div></div>`;
  return "";
}
async function installApp() { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; home(); }
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js");

/* ---------- 새 버전이 올라오면 저절로 새로고침 ---------- */
// 앱 파일 두 개의 지문을 기억해 두고, 다시 볼 때 달라졌으면 새로고침 (공부 중엔 끝난 뒤에)
let verSig = null, updateWaiting = false;
async function siteSig() {
  const texts = await Promise.all(["index.html", "words.js"].map(u => fetch(u, { cache: "no-cache" }).then(r => r.ok ? r.text() : Promise.reject())));
  let h = 5381; const s = texts.join("\u0000");
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return s.length + ":" + h;
}
async function checkUpdate() {
  if (location.protocol === "file:" || navigator.onLine === false) return;
  try {
    const sig = await siteSig();
    if (!verSig) { verSig = sig; return; }
    if (sig !== verSig) updateWaiting = true;
  } catch (e) { return; }
  applyUpdateIfIdle();
}
function applyUpdateIfIdle() {
  const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (updateWaiting && !S && !typing && !$("#alert") && !$("#dlg") && !$("#sheet")) location.reload();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
setInterval(() => { if (document.visibilityState === "visible") checkUpdate(); }, 5 * 60 * 1000);

load(); home(); syncNow(); checkUpdate();
</script>
</body>
